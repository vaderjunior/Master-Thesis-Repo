name: types_dev
description: >
  hate_type dimension. Gold is single-label by construction (Implicit Hate
  assigns one type per post) while the taxonomy declares it multilabel, so
  multilabel macro-F1 is primary and gold-in-predicted-set is reported as a
  diagnostic ceiling. Top-1 by vote share was rejected: 51-68% of items tie.
subset: en_dev_eval_types
arms: [zero_shot, few_shot, rag]
provider: tudagpt
allow_fallback: false
n_votes: 3
workers: 4
gate_mapping: both
hate_type_scoring: multilabel