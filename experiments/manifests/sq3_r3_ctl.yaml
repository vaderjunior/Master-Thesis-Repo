name: sq3_r3_ctl
description: >
  SQ3 round 3, matched-size control. KB c0a47fda41431b14: base 360 records plus 48
  correctly-labelled records, matched one-for-one in count, kind and bucket to
  sq3_r3_fb. Round 3 adds 15: 12 items the ROUND-2 CONTROL ARM got right in
  b3, plus 3 correctly-labelled TRAIN items to match the count exactly.

  This arm is not an afterthought. At k=3 it outperformed every other run in
  the phase (macro 0.384 against a round-0 mean of 0.357, predicted labels
  1.64 against a round-0 range of 1.719-1.769), which is the evidence that
  adding correctly-labelled records helps on its own. Only this arm can
  separate that from error-selection, and error-selection has now measured
  0.000 at round 1 and +0.002 at round 2.
