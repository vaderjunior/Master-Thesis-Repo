name: severity_kbv3_r2
description: >
  Replicate 2; separate manifest because the runner is resumable and re-running 
  one name would resume rather than replicate.

  Severity under the current KB b3e1a021777f7b85 and the frozen prompt. This
  subset has only ever been run once, under 475869f9 - two KB generations old,
  before the German guidelines and the BoTox examples existed - and has NO
  replicate at all. It is the only dimension in the project without a variance
  floor.

  Two replicates. 45 items, 15 per band, so this is the thinnest subset in the
  project and the floor is expected to be wide; measuring it is the point.

  Severity is scored as ordinal multiclass with mean absolute rank error and
  within-one accuracy alongside macro-F1, since predicting `high` for a `low`
  item is not the same error as predicting `medium`.
subset: en_dev_eval_severity
arms: [zero_shot, few_shot, rag]
provider: peasec
pinned_model: Qwen/Qwen3-VL-32B-Instruct
temperature: 1.0
allow_fallback: false
n_votes: 3
workers: 8
gate_mapping: strict
retrieval:
  strategy: hybrid
  k_definitions: 2
  k_guidelines: 2
  k_examples: 5
  k_examples_feedback: 0
  use_mmr: true
  mmr_lambda: 0.7
  mmr_pool_factor: 3
  use_reranker: false
  rrf_k: 60