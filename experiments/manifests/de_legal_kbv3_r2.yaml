name: de_legal_kbv3_r2
description: >
  Replicate 2; separate manifest because the runner is resumable and re-running 
  one name would resume rather than replicate.

  Legal dimension under the current KB b3e1a021777f7b85 and the frozen prompt.
  This subset has only ever been run under c34e780c (legal_dev_peasec and its
  two replicates), so the legal numbers sit in a different comparability group
  from every English result.

  In scope under R5: legal is capped at a contained evaluation, not extended
  into SQ1 or SQ3. This is the same evaluation on the current system, not an
  extension. Dev only; de_legal_test_eval remains untouched.

  Two replicates. Legal's floor of +/-0.007 was measured under c34e780c and is
  the tightest in the project; whether it holds under the current KB is
  unmeasured.
subset: de_legal_dev_eval
arms: [zero_shot, few_shot, rag]
provider: peasec
pinned_model: Qwen/Qwen3-VL-32B-Instruct
temperature: 1.0
allow_fallback: false
n_votes: 3
workers: 8
gate_mapping: strict
retrieval:
  strategy: hybrid
  k_definitions: 2
  k_guidelines: 2
  k_examples: 5
  k_examples_feedback: 0
  use_mmr: true
  mmr_lambda: 0.7
  mmr_pool_factor: 3
  use_reranker: false
  rrf_k: 60