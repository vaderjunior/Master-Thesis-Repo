name: sq3_r4_fb_rep3
description: >
  Replicate 3 of the round-4 feedback arm. Identical configuration and KB
  e4ff5e0234d51ba3; a separate manifest because the runner is resumable and
  re-running one name would resume rather than replicate.

  Every point in the learning curve is n=1 per arm per round, and the arms
  differ in KB at every round, so the comparison has been across-round rather
  than within-condition. Three replicates of each arm at ONE fixed KB state
  give a real variance estimate for macro-F1 and for Krippendorff's alpha, and
  make the oracle-vs-actual comparison two-sided - the oracle now has three
  replicates per condition while the feedback arm has one.
