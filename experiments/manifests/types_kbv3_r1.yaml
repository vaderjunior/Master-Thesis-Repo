  types_dev_peasec iss prompt c74cb7ab + KB 475869f9, types_peasec_kbv2 is
  prompt 8e588db7 + KB c34e780c.

  Two open questions, both currently confounded between subset and KB.

  (1) types_dev_peasec's zero_shot scored 0.280 and types_peasec_kbv2's 0.340,
  both n=1 at a subset whose hate_type floor is ~0.058. The three-replicate
  467-item value is 0.336 +/- 0.003, so 0.280 looks like a low draw. If it is,
  the project's only p<0.05 result (rag - zero_shot +0.088, p=0.018) rested on
  an unlucky baseline rather than on a real effect.

  (2) The rag arm predicted `explicit` twice in 103 items under both earlier
  KBs, against 19-23 for zero_shot, while predicting it 49 times in 467 items
  under the current KB. Subset or KB cannot presently be separated.

  Two replicates, so this also gives the first within-condition floor estimate
  at n=103 under a fixed state.
