name: main_sq3_fb_r4
description: >
  Feedback arm's round-4 KB e4ff5e0234d51ba3 (60 error-selected corrections)
  on the balanced reporting slice. Paired with main_sq3_ctl_r4 and
  main_base_r0.

  The prediction, stated before the run: if the SQ3 gate effect is genuine
  adaptation, false negatives fall relative to both other arms while false
  positives do not rise. If it is over-flagging, FP rises in step and the
  effect is an artefact of measuring recall on an all-hateful subset.

  Note that both arms' records carry gate=true, since every SQ3 item is
  hateful - so any pure "more hateful examples" effect should appear in the
  control too. Only a fb-specific FN drop supports error-selection.
