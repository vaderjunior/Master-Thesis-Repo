name: main_sq3_ctl_r4
description: >
  Matched-size control's round-4 KB d30f6900722d9e6f (60 correctly-labelled
  records, same count, kind and bucket) on the balanced reporting slice.

  This arm carries the same 60 gate=true records without error-selection, so
  it separates "more hateful examples in the prompt" from "corrections for
  items the system wrongly called not-hate". On the SQ3 subset it showed no
  FN reduction at all (65/66/68/69, indistinguishable from round 0), which is
  what makes the feedback arm's 54/59/62/64 worth testing here.
records_path: kb/records_sq3_ctl_r4.jsonl
chroma_path: kb/chroma_sq3_ctl_r4
subset: en_dev_eval_main
arms: [rag]
provider: peasec
pinned_model: Qwen/Qwen3-VL-32B-Instruct
temperature: 1.0
allow_fallback: false
n_votes: 3
workers: 8
gate_mapping: both
retrieval:
  strategy: hybrid
  k_definitions: 2
  k_guidelines: 2
  k_examples: 5
  k_examples_feedback: 1
  use_mmr: true
  mmr_lambda: 0.7
  mmr_pool_factor: 3
  use_reranker: false
