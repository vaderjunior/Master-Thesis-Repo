name: sq3_r1_ctl
description: >
  SQ3 round 1, MATCHED-SIZE CONTROL arm. KB 329b15027f14c02e: the same frozen
  base 360 records plus 20 correctly-labelled records - 13 items from batch b1
  that the round-0 system got RIGHT, plus 7 TRAIN items with gold labels to
  match the feedback arm's count exactly.

  Same count, same kind, same bucket, same round, same k_examples_feedback: 1.
  Only error-selection differs. If both arms rise together, knowledge-base
  growth explains it and the honest reading is that error-driven correction
  adds nothing at this scale - which is a publishable negative result about
  naive feedback write-back, and is exactly what this arm exists to detect.
