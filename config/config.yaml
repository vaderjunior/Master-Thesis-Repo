api:
  temperature: 1.0
  timeout_seconds: 180
  max_tokens: 4096          # peasec only; guards against silent truncation
  tudagpt:
    url_env: TUDAGPT_URL    # full endpoint, incl. /api/ai-req
    token_env: TUDAGPT_TOKEN
    default_model: qwen3.5-122b-a10b
    models_strong:
      - qwen3.5-397b-a17b
      - glm-4.7
      - mistral-large-3-675b-instruct-2512   # OFFLINE 2026-07-21
    models_medium:
      - qwen3.5-122b-a10b
      - openai-gpt-oss-120b
    models_fast:
      - qwen3-30b-a3b-instruct-2507
      - meta-llama-3.1-8b-instruct
  peasec:
    url_env: PEASEC_URL     # https://openwebui.srv.peasec.de/api/v1
    token_env: PEASEC_TOKEN
    # Model IDs carry a vendor prefix and a slash. Verify against
    # `check_client --provider peasec --list-models` before pinning: the
    # TUDaGPT roster drifted silently between phases and documentation lagged.
    default_model: Qwen/Qwen3-VL-32B-Instruct
    models_strong:
      - Qwen/Qwen3-VL-32B-Instruct
    models_medium:
      - Qwen/Qwen3-VL-32B-Instruct
    models_fast:
      - Qwen/Qwen3-VL-8B-Instruct

classify:
  provider: tudagpt         # switch to peasec once the bake-off says so
  pinned_model: qwen3.5-122b-a10b
  max_repair_retries: 2
  n_votes_dev: 3
  n_votes_formal: 5
  fewshot_seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  kb_records: kb/records.jsonl
  results: experiments/results

kb:
  records_path: kb/records.jsonl
  chroma_path: kb/chroma
  embedding_model: BAAI/bge-m3
  examples_per_label: 10

retrieval:
  strategy: hybrid          # dense | bm25 | hybrid   <- SQ1 Stage B
  k_definitions: 2          # <- SQ1 Stage A/D
  k_guidelines: 2
  k_examples: 5
  use_mmr: true             # <- SQ1 Stage C
  mmr_lambda: 0.7
  mmr_pool_factor: 3
  use_reranker: false       
  rrf_k: 60                 # cited (Cormack 2009), not tuned

classify:
  pinned_model: qwen3.5-122b-a10b   # asserted when allow_fallback is off
  max_repair_retries: 2
  n_votes_dev: 3
  n_votes_formal: 5
  fewshot_seed: 42