api:
    base_url_env: TUDAGPT_URL      # we read the actual URL from .env
    token_env: TUDAGPT_TOKEN       # we read the actual token from .env
    models_strong:
      - mistral-large-3-675b-instruct-2512
      - qwen3.5-397b-a17b
      - deepseek-r1-distill-llama-70b
    models_medium:
      - qwen3.5-122b-a10b
      - openai-gpt-oss-120b
      - glm-4.7
    models_fast:
      - meta-llama-3.3-70b-instruct    # verify
      - gemma-3-27b-instruct          # verify
      - qwen-3.5-27b                  # verify
    temperature: 1.0
    max_retries: 2
    timeout_seconds: 40

paths:
  data_raw: data/raw
  data_processed: data/processed
  kb_records: kb/records.jsonl
  results: experiments/results

kb:
  records_path: kb/records.jsonl
  chroma_path: kb/chroma
  embedding_model: BAAI/bge-m3
  examples_per_label: 10

retrieval:
  strategy: hybrid           # dense | bm25 | hybrid  
  k_definitions: 2
  k_guidelines: 2
  k_examples: 5
  use_mmr: false            # 4.5
  mmr_lambda: 0.7
  use_reranker: false       # stub, Phase 8 Stage C
  rrf_k: 60                 # 4.4